# Security headers for every response (included in nginx.conf). nginx drops server-level
# add_header lines inside a location that has its own, so each such location includes this file.
#
# Content-Security-Policy: scripts only from this site; data only from this site and Supabase
# (*.supabase.co; change it if the project uses a custom domain); fonts from Google Fonts.
# 'wasm-unsafe-eval' and blob: workers are for the iPhone photo (HEIC) converter.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://*.supabase.co; connect-src 'self' data: blob: https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# No other site may show these pages in a frame (stops click-jacking)
add_header X-Frame-Options "DENY" always;
# Browsers must not guess file types (an uploaded file can't be run as a script)
add_header X-Content-Type-Options "nosniff" always;
# Other sites see only the domain we came from, never the full page address
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The site never uses the camera, microphone or location
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Once seen over HTTPS, browsers use HTTPS only for a year (ignored over plain HTTP)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
