server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Pages are routed client-side by pathname, so unknown paths get index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browsers must re-check index.html so a rebuild shows up without a hard refresh;
    # the hashed files in /assets can still be cached
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
