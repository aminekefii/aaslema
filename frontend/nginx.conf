server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Don't show the nginx version on error pages and in headers
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Pages are routed client-side by pathname, so unknown paths get index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browsers must re-check index.html so a rebuild shows up without a hard refresh;
    # the hashed files in /assets can still be cached
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
